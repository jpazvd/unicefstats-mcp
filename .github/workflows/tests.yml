name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Version consistency
        run: python scripts/check_version_consistency.py
      - name: Lint
        run: ruff check src/ tests/
      - name: Type check
        run: mypy src/unicefstats_mcp/
      - name: Test
        run: pytest tests/ -v --cov=unicefstats_mcp --cov-report=xml

  validate-public-workflows:
    # Files under .github/workflows-public/ are NOT executed on this repo
    # (GitHub Actions ignores non-standard workflow paths) — they get synced
    # to the public mirror's .github/workflows/ by sync-to-public.yml.
    # GitHub's workflow parser therefore never validates them on dev, and
    # tests.yml's main pytest job doesn't touch them either. Without this
    # job, a syntax error in a public-only workflow would only surface
    # AFTER it's been pushed to the public repo as part of a release —
    # too late to fix without another tag.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate YAML syntax of workflows-public/
        run: |
          set -euo pipefail
          if [ ! -d .github/workflows-public ]; then
            echo "No .github/workflows-public/ directory — nothing to validate."
            exit 0
          fi
          shopt -s nullglob
          files=(.github/workflows-public/*.yml .github/workflows-public/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No YAML files under .github/workflows-public/ — skipping."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Parsing $f"
            python -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f"
          done
          echo "OK: all public-only workflow YAMLs parse cleanly."

  markdownlint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint Markdown
        # markdownlint-cli2 is fast, no install step needed (npx fetches it).
        # Version pinned to stabilise CI — major/minor releases of
        # markdownlint-cli2 can change rule defaults or behavior. Bump
        # this number deliberately when you want the upstream change.
        # Config in .markdownlint.json. Use glob negation (#) to skip internal/
        # — those are draft-only files that don't sync to the public mirror.
        run: npx --yes markdownlint-cli2@0.22.1 "**/*.md" "#internal/**"
